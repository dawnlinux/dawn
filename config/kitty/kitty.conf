# The palette, generated by dawn-theme.
#
# Absolute rather than relative: in a packaged install this file lives under
# /usr/share and is read-only, so the generated colours cannot sit beside it.
# kitty's `include` applies expanduser, so `~` resolves.
#
# ORDER MATTERS: later values win. colors/colors.conf is the shipped default
# and comes first; the generated palette overrides it. Before dawn-theme has
# ever run the generated file does not exist, and kitty skips a missing
# include — so a fresh install falls back cleanly.
include colors/colors.conf
include ~/.config/dawn/generated/kitty-colors.conf

font_family      JetBrains Mono Nerd Font
font_size 11.0

cursor_shape beam
cursor_trail 10

window_margin_width 20

confirm_os_window_close 0

wheel_scroll_multiplier 5.0

underline_hyperlinks always

remember_window_size no

scrollbar_handle_opacity 0

scrollbar_track_opacity 0

scrollbar_track_hover_opacity 0

sync_to_monitor 0

repaint_delay 8
input_delay 3

shell fish

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
