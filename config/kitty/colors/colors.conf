# Dawn terminal palette — monochrome by design.
#
# Dawn ships one colour scheme. The colour in the desktop comes from the
# wallpaper at runtime (dawn-island/services/Accent.qml), which is why the
# terminal stays neutral: a coloured scheme here would fight it.
#
# Keep in sync with config/quickshell/dawn-island/theme/Theme.qml and
# config/rofi/colors.rasi.
#
# Included from ../kitty.conf.

background            #0f0f0f
foreground            #d4d4d4
cursor                #ffffff

selection_background  #2b2b2b
selection_foreground  #ffffff

color0   #0a0a0a
color1   #4a4a4a
color2   #6a6a6a
color3   #8a8a8a
color4   #a0a0a0
color5   #b5b5b5
color6   #c8c8c8
color7   #d4d4d4

color8   #404040
color9   #5c5c5c
color10  #7a7a7a
color11  #969696
color12  #b0b0b0
color13  #c8c8c8
color14  #e0e0e0
color15  #ffffff
