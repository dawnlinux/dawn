# Don't print a new line at the start of the prompt
add_newline = false
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

# format = """
# $directory $fill $git_branch $cmd_duration
#  $character"""

# Prompt layout
format = """
$cmd_duration $directory$git_branch
  $character"""

[fill]
symbol = "─"
style = "fg:#404040"

[character]
success_symbol = "[ ](bold fg:#e0e0e0)"
error_symbol = "[ ](bold fg:#969696)"

[package]
disabled = true

[git_branch]
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
style = "bg:#404040"
format = " 󰜥 [](bold fg:#404040)[$symbol $branch(:$remote_branch)](fg:#ffffff bg:#404040)[ ](bold fg:#404040)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold #969696)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 "
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](#ffffff)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format = "[•$hostname](bg:#404040 bold fg:#ffffff)[](bold fg:#404040)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold fg:#969696"

[time]
disabled = true
format = "🕙[\\[ $time \\]]($style) "
time_format = "%T"

[username]
style_user = "bold bg:#404040 fg:#ffffff"
style_root = "bold fg:#ffffff bg:#404040"
format = "[](bold fg:#404040)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:#4a4a4a fg:#e0e0e0"
truncation_length = 2
truncation_symbol = ".../"
format = "[](bold fg:#4a4a4a)[󰉋 → $path]($style)[](bold fg:#4a4a4a)"

[directory.substitutions]
"Desktop" = ""
"Documents" = ""
"Downloads" = ""
"Music" = "󰎈"
"Pictures" = ""
"Videos" = ""
"GitHub" = "󰊤"

[cmd_duration]
min_time = 0
format = "[](bold fg:#ffffff)[󰪢 $duration](bold bg:#ffffff fg:#000000)[](bold fg:#ffffff)"
