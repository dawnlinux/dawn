# The compositor the login screen runs in.
#
# greetd starts this as the unprivileged `greeter` user, it hosts exactly one
# client, and it exists only to put a Wayland display with wlr-layer-shell on
# it under dawn-greet. Everything that is not that is turned off: this sits on
# the path between power-on and your desktop, and anything it does is time you
# spend looking at nothing.
#
# Installed to /etc/greetd/hyprland.conf. Every option here was checked against
# the running Hyprland with `hyprctl getoption` before being written down — an
# unknown key does not get ignored, it raises Hyprland's config-error overlay,
# on top of the login screen, where you cannot dismiss it.

# `auto` scale, not a hardcoded 1.
#
# A HiDPI panel reports its full pixel resolution — a 2880x1800 laptop display
# at scale 1 draws the greeter at half the size everything else on the machine
# is drawn at, which is the wrong first thing to see. `auto` asks Hyprland for
# the same scale it would pick for the desktop session, so the login screen and
# the desktop agree.
#
# This mirrors config/hypr/modules/monitors.lua, which is also `preferred, auto,
# auto`. If you override a monitor there for your hardware, the same override
# belongs here — the greeter is a second compositor and shares nothing with it.
monitor = , preferred, auto, auto

# There is one client and it is a layer surface, so none of the window
# management has anything to act on.
general {
    border_size = 0
    gaps_in = 0
    gaps_out = 0
}

animations {
    enabled = false
}

decoration {
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

misc {
    # Hyprland's wallpaper and logo would otherwise flash up in the moment
    # between the compositor coming up and the greeter drawing on it. Nothing
    # behind the greeter should ever be seen.
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true

    # Nobody is going to edit this file while sitting at the login screen, and
    # the watch is one more thing running before you are let in.
    disable_autoreload = true
}

input {
    kb_layout = us

    # Hyprland's default is a 600ms delay at 25/s. On a password field that is
    # a login screen which eats backspaces.
    repeat_delay = 300
    repeat_rate = 40
}

# The greeter, and nothing else.
#
# `qs` exits on its own once greetd has accepted the session — that is what
# `Greetd.launch(..., quit: true)` in Auth.qml does. When it goes, this
# compositor has no remaining purpose, so it goes too. Without the trailing
# `dispatch exit` it would sit on the display as an empty screen waiting to be
# killed, which is the exact failure this whole setup exists to avoid.
exec-once = sh -c 'qs -p /etc/greetd/dawn-greet/shell.qml; hyprctl dispatch exit'
